PLG_CONTENT_FGAUTOLIGHTBOX="Content - FG AutoLightbox"
PLG_CONTENT_FGAUTOLIGHTBOX_XML_DESCRIPTION="Automatically adds a lightbox to all images in articles. No external dependencies. Native Joomla 6 build only (PHP 8.3+, PSR-4, SubscriberInterface, DI via services/provider.php). For Joomla 3.10, see the classic build in the repository root (no longer under active development)."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_GALLERY_GROUP_LABEL="Gallery group name"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_GALLERY_GROUP_DESC="Internal identifier for grouping images (arrow navigation)."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_LINK_CLASS_LABEL="Extra link CSS class"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_LINK_CLASS_DESC="Optional additional CSS class added to the link wrapper, for your own custom styling. The plugin's own functionality always uses a fixed internal class and does not depend on this setting."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_CLASSES_LABEL="Exclude CSS classes"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_CLASSES_DESC="Images with these CSS classes will be skipped - also checked on the image's wrapping element (e.g. a figure or div), up to a few levels up, not just the image itself, so wrapping a whole block is enough. Separate multiple classes with a comma. Example: no-lightbox, logo, banner"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_LABEL="Caption under image"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_DESC="What to show as caption below the image in lightbox."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_OPT_ALT="Alt text (from image alt attribute)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_OPT_FILENAME="File name (from src)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_OPT_NONE="Do not show caption"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_LABEL="Show caption on mobile too"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_DESC="By default the caption is hidden on small (mobile) screens to keep the image as large as possible. Enable this to show it there too."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_OPT_NO="No (default)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_OPT_YES="Yes"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXTRA_CONTEXTS_LABEL="Extra allowed contexts"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXTRA_CONTEXTS_DESC="Process images in additional contexts beyond the built-in ones (com_content, com_contact, com_newsfeeds) - useful for K2, Zoo, or other custom components. Separate multiple entries with a comma. Use an exact context (e.g. com_k2.item), or match an entire component with a wildcard (com_k2.* or just com_k2)."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_COMPONENTS_LABEL="Exclude components"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_COMPONENTS_DESC="Component names where the plugin should NOT process images. Separate multiple with a comma. Example: com_contact, com_newsfeeds. Plugin currently applies to: com_content, com_contact, com_newsfeeds."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_URLS_LABEL="Exclude pages/URLs"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_URLS_DESC="Pages where the plugin should NOT run. Separate multiple with a comma. Each entry is matched against the page URL (path + query) with word-boundary awareness, so e.g. /12 matches /12 or /path/12 but not /120 or /1129 - it won't accidentally catch longer numbers or words that merely contain your pattern. If you deliberately want broader matching, add * as a wildcard, e.g. /kontakt* also matches /kontakt-us or /kontakty. Example: /12, /kontakt*, task=edit"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_ALLOWED_EXTENSIONS_LABEL="Allowed file extensions"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_ALLOWED_EXTENSIONS_DESC="Only images with these file extensions will get a lightbox link. Others (e.g. .svg) are left untouched. SVG is excluded by default because it may contain embedded scripts. Separate multiple with a comma."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_LABEL="Prefer srcset over data-src"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_DESC="Decides which wins when an image has both a data-src attribute and a srcset, since different lazy-load libraries use data-src for opposite purposes: some use it to hold the real full-size image (data-src wins, default - matches how most lazy-load setups this plugin has been tested against work), others use it only for a small placeholder while the true full-size versions live in srcset (enable this to make srcset win instead). If your lightbox opens a small/blurry thumbnail instead of the full image, try enabling this."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_OPT_NO="No (data-src wins - default)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_OPT_YES="Yes (srcset wins)"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_LABEL="Enable gallery navigation"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_DESC="Show prev/next arrows, the image counter, and enable keyboard/swipe navigation between images. Disable this if you want the lightbox to act as a single-image viewer (each image opens on its own, with no navigation to the others)."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_OPT_YES="Yes (default)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_OPT_NO="No"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_LABEL="Preload adjacent images"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_DESC="Preload the previous and next image in the background while the lightbox is open, so navigation feels smoother. Disable this on very large galleries if you want to avoid the extra background downloads."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_OPT_YES="Yes (default)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_OPT_NO="No"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_LABEL="Watch for dynamically added images"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_DESC="Off by default - a typical article/blog with no AJAX-loaded images doesn't need it, and it isn't free: it uses a MutationObserver watching the whole page for changes, which adds a small but real ongoing cost on pages with a lot of unrelated DOM activity (animations, chat widgets, cookie banners). Turn this on only if your site actually adds images to the page after it loads (AJAX, infinite scroll, sliders, lazy-loaded galleries) and you want the lightbox to pick those up automatically. Static images (present when the page loads) work correctly either way - this setting only affects images added later."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_OPT_YES="Yes"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_OPT_NO="No (default)"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_CONTAINER_LABEL="Watch container (CSS selector)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_CONTAINER_DESC="Optional, and only relevant if 'Watch for dynamically added images' above is enabled. Instead of watching the entire page for dynamically added images, watch only the container(s) matching this CSS selector (e.g. .item-page, .blog) - reduces overhead on pages with a lot of unrelated DOM activity (animations, chat widgets). You can list several selectors separated by a comma; each matching element is watched, including ones created dynamically after page load (e.g. by AJAX). Leave empty to watch the whole page. If the selector never matches anything, dynamically-added images outside any matching container will not be tracked - images already present when the page loads are unaffected."

PLG_CONTENT_FGAUTOLIGHTBOX_JS_DIALOG_LABEL="Image gallery"
PLG_CONTENT_FGAUTOLIGHTBOX_JS_CLOSE_LABEL="Close"
PLG_CONTENT_FGAUTOLIGHTBOX_JS_PREV_LABEL="Previous image"
PLG_CONTENT_FGAUTOLIGHTBOX_JS_NEXT_LABEL="Next image"
PLG_CONTENT_FGAUTOLIGHTBOX_JS_ERROR_LABEL="Failed to load image"
