PLG_CONTENT_FGAUTOLIGHTBOX="Obsah - FG AutoLightbox"
PLG_CONTENT_FGAUTOLIGHTBOX_XML_DESCRIPTION="Automaticky pridá lightbox ku všetkým obrázkom v článkoch. Bez externých závislostí. Natívny build len pre Joomla 6 (PHP 8.3+, PSR-4, SubscriberInterface, DI cez services/provider.php). Pre Joomla 3.10 pozri classic build v koreni repozitára (ďalej sa nevyvíja)."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_GALLERY_GROUP_LABEL="Názov skupiny galérie"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_GALLERY_GROUP_DESC="Interný identifikátor pre zoskupenie obrázkov (navigácia šípkami)."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_LINK_CLASS_LABEL="Dodatočná CSS trieda odkazu"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_LINK_CLASS_DESC="Voliteľná dodatočná CSS trieda pridaná na odkaz okolo obrázka, pre vaše vlastné štylizovanie. Samotná funkčnosť pluginu vždy používa pevnú internú triedu a od tohto nastavenia nezávisí."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_CLASSES_LABEL="Vylúčiť CSS triedy"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_CLASSES_DESC="Obrázky s týmito CSS triedami sa preskočia. Viac tried oddeľte čiarkou. Príklad: no-lightbox, logo, banner"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_LABEL="Popisok pod obrázkom"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_DESC="Čo zobraziť ako popisok pod obrázkom v lightboxe."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_OPT_ALT="Alt text (z atribútu alt obrázka)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_OPT_FILENAME="Názov súboru (zo src)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_CAPTION_OPT_NONE="Nezobrazovať popisok"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_LABEL="Zobraziť popisok aj na mobile"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_DESC="Predvolene je popisok na malých (mobilných) obrazovkách skrytý, aby bol obrázok čo najväčší. Zapnutím ho zobrazíte aj tam."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_OPT_NO="Nie (predvolené)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_CAPTION_MOBILE_OPT_YES="Áno"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXTRA_CONTEXTS_LABEL="Ďalšie povolené kontexty"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXTRA_CONTEXTS_DESC="Spracovať obrázky aj v ďalších kontextoch nad rámec vstavaných (com_content, com_contact, com_newsfeeds) - vhodné pre K2, Zoo alebo iné vlastné komponenty. Viac záznamov oddeľte čiarkou. Použite buď presný kontext (napr. com_k2.item), alebo celý komponent naraz cez wildcard (com_k2.* alebo len com_k2)."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_COMPONENTS_LABEL="Vylúčiť komponenty"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_COMPONENTS_DESC="Názvy komponentov, kde plugin NEMÁ spracúvať obrázky. Viac oddeľte čiarkou. Príklad: com_contact, com_newsfeeds. Plugin sa momentálne aplikuje na: com_content, com_contact, com_newsfeeds."

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_URLS_LABEL="Vylúčiť stránky/URL"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_EXCLUDE_URLS_DESC="Stránky, kde sa plugin NEMÁ spúšťať. Viac oddeľte čiarkou. Každý záznam sa porovnáva ako podreťazec kdekoľvek v URL stránky (cesta + query). Príklad: /kontakt, /aktualne/1229-novy-eeg, task=edit"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_ALLOWED_EXTENSIONS_LABEL="Povolené prípony súborov"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_ALLOWED_EXTENSIONS_DESC="Lightbox odkaz dostanú iba obrázky s týmito príponami. Ostatné (napr. .svg) zostanú nedotknuté. SVG je predvolene vylúčené, keďže môže obsahovať vložené skripty. Viac oddeľte čiarkou."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_LABEL="Uprednostniť srcset pred data-src"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_DESC="Rozhoduje, čo vyhrá, ak má obrázok súčasne atribút data-src aj srcset - rôzne lazy-load knižnice totiž používajú data-src na opačné účely: niektoré ho používajú na skutočný plnohodnotný obrázok (predvolene vyhráva data-src - zodpovedá tomu, ako fungovala väčšina lazy-load nastavení, na ktorých bol tento plugin doteraz testovaný), iné ho používajú len na malý placeholder, zatiaľ čo skutočné plnohodnotné verzie sú v srcset (zapnite toto, aby namiesto neho vyhrával srcset). Ak sa vám v lightboxe otvára malý/rozmazaný náhľad namiesto plného obrázka, skúste toto zapnúť."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_OPT_NO="Nie (vyhráva data-src - predvolené)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PREFER_SRCSET_OPT_YES="Áno (vyhráva srcset)"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_LABEL="Povoliť navigáciu v galérii"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_DESC="Zobrazí šípky vpred/vzad, počítadlo obrázkov, a umožní navigáciu klávesnicou/swipe medzi obrázkami. Vypnite, ak má lightbox fungovať ako prehliadač jedného obrázka (každý obrázok sa otvorí samostatne, bez navigácie na ostatné)."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_OPT_YES="Áno (predvolené)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_SHOW_NAVIGATION_OPT_NO="Nie"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_LABEL="Prednačítať susedné obrázky"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_DESC="Na pozadí prednačíta predchádzajúci a nasledujúci obrázok, kým je lightbox otvorený, aby bola navigácia plynulejšia. Pri veľmi veľkých galériách môžete vypnúť, ak chcete predísť dodatočnému sťahovaniu na pozadí."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_OPT_YES="Áno (predvolené)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_PRELOAD_ADJACENT_OPT_NO="Nie"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_LABEL="Sledovať dynamicky pridané obrázky"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_DESC="Automaticky zachytiť a spracovať obrázky pridané po načítaní stránky (AJAX, infinite scroll, slidery). Používa MutationObserver sledujúci celú stránku. Ak sa DOM vašej stránky mení veľmi často z iných dôvodov (náročné animácie, chat widgety a pod.), môžete toto vypnúť kvôli miernemu zlepšeniu výkonu - statické obrázky budú fungovať naďalej normálne."
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_OPT_YES="Áno (predvolené)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_DYNAMIC_OPT_NO="Nie"

PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_CONTAINER_LABEL="Sledovaný kontajner (CSS selektor)"
PLG_CONTENT_FGAUTOLIGHTBOX_FIELD_WATCH_CONTAINER_DESC="Voliteľné. Namiesto sledovania celej stránky kvôli dynamicky pridaným obrázkom sledujte len kontajner(y) zodpovedajúce tomuto CSS selektoru (napr. .item-page, .blog) - znižuje záťaž na stránkach s množstvom nesúvisiacej DOM aktivity (animácie, chat widgety). Môžete vypísať viac selektorov oddelených čiarkou, sleduje sa každý zodpovedajúci prvok vrátane tých, ktoré vzniknú dynamicky po načítaní stránky (napr. cez AJAX). Nechajte prázdne pre sledovanie celej stránky (predvolené). Ak selektor nikdy nič nenájde, dynamicky pridané obrázky mimo zodpovedajúceho kontajnera sa nebudú sledovať - obrázky prítomné už pri načítaní stránky tým nie sú dotknuté."

PLG_CONTENT_FGAUTOLIGHTBOX_JS_DIALOG_LABEL="Galéria obrázkov"
PLG_CONTENT_FGAUTOLIGHTBOX_JS_CLOSE_LABEL="Zatvoriť"
PLG_CONTENT_FGAUTOLIGHTBOX_JS_PREV_LABEL="Predchádzajúci obrázok"
PLG_CONTENT_FGAUTOLIGHTBOX_JS_NEXT_LABEL="Ďalší obrázok"
